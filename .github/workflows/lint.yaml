---
name: Lint Yaml
on: # yamllint disable-line rule:truthy
  push:
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: login to Github Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Code
        uses: actions/checkout@v7
      - uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: "/kubeconform"
          # yamllint disable rule:line-length
          args: -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json -skip kustomize.config.k8s.io/v1beta1/Kustomization -summary -output json manifests/
          # yamllint enable rule:line-length
