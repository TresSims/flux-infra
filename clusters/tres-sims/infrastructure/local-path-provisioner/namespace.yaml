---
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-provisioner
  # The provisioner and its transient helper pods mount hostPath, which the
  # cluster-wide `baseline` PodSecurity default forbids.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
