---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: "1.18.6"
      sourceRef:
        kind: HelmRepository
        name: cilium-helm
        namespace: kube-system
      interval: 10m
  values:
    operator:
      replicas: 1
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: 147.93.132.253
    k8sServicePort: 6443
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cluster:
      name: tres-sims-com
    hubble:
      tls:
        auto:
          enabled: true
          method: cronJob
          certValidDuration: 1095
          schedule: 0 0 1 */4 *
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    ingressController:
      enabled: false
      default: false
    egressGateway:
      enabled: false
    bpf:
      masquerade: true
