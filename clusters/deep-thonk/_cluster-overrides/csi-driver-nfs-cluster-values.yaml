---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-driver-nfs-cluster-values
  namespace: nfs-csi
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    storageClasses:
      - name: nfs-retain
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=4.1
        parameters:
          server: deep-thonk.com
          share: /mnt/plex/k8s
