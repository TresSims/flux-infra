---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: "./clusters/deep-thonk/applications"
  prune: true
  timeout: 1m
  dependsOn:
    - name: configuration
