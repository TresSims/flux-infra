---
# One-time prebinding of the original retained PV after stopping Vault and
# deleting its old PVC. Apply before installing the openbao HelmRelease.
# Intentionally excluded from kustomization.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-openbao-0
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
    component: server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain
  volumeName: pvc-e7b14290-42ab-446e-9b34-8f0e633c7aa2
  resources:
    requests:
      storage: 10Gi
