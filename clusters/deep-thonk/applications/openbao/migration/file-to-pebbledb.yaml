---
# One-shot offline migration; intentionally excluded from kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-storage-migration
  namespace: openbao
data:
  migrate.hcl: |
    storage_source "file" {
      path = "/openbao/data/legacy-file"
    }
    storage_destination "pebbledb" {
      path = "/openbao/data/pebbledb"
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-storage-migration
  namespace: openbao
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: migrate
          image: quay.io/openbao/openbao:2.7.1
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              # Refuse to repeat a migration or overwrite an existing store.
              test -d /openbao/data/core
              test ! -e /openbao/data/legacy-file
              test ! -e /openbao/data/pebbledb
              mkdir /openbao/data/legacy-file
              find /openbao/data -mindepth 1 -maxdepth 1 ! -name legacy-file \
                -exec mv {} /openbao/data/legacy-file/ \;
              bao operator migrate -config=/migration/migrate.hcl
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /openbao/data
            - name: config
              mountPath: /migration
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-openbao-0
        - name: config
          configMap:
            name: openbao-storage-migration
