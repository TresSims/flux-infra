---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    name: vault-store
    kind: SecretStore
  target:
    name: operator-oauth
    template:
      type: Opaque
      data:
        client_id: "{{.client_id}}"
        client_secret: "{{.client_secret}}"
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/operator-credential
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/operator-credential
        property: client_secret
