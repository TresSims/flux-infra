---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-store
  namespace: o11y
spec:
  provider:
    # OpenBao uses ESO's Vault-compatible provider.
    vault:
      server: "https://openbao.k8s.deep-thonk.com"
      path: "kubernetes"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: "approle-creds"
            key: "openbao-role-id"
          secretRef:
            name: "approle-creds"
            key: "openbao-role-secret"
