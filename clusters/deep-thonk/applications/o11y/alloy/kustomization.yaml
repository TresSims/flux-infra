---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml

configMapGenerator:
  - name: alloy-config
    namespace: o11y
    files:
      - config/config.alloy
      - config/discovery.alloy
      - config/ingress.alloy
      - config/logs.alloy
      - config/metrics.alloy
      - config/outputs.alloy
    options:
      disableNameSuffixHash: true
