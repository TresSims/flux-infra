---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-sync.yaml
  - infrastructure.yaml
  - configuration.yaml
  - applications.yaml
generatorOptions:
  disableNameSufficHash: true
configMapGenerator:
  - name: cluster-substitutions
    literals:
      - cluster=deep-thonk
