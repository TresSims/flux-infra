---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-sync
  path: "./clusters/tres-sims-com/applications"
  prune: true
  timeout: 1m
  dependsOn:
    - name: configuration
