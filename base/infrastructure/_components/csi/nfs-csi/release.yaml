---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-csi
  namespace: nfs-csi
spec:
  interval: 10m
  chart:
    spec:
      chart: csi-driver-nfs
      version: '4.13.0'
      sourceRef:
        kind: HelmRepository
        name: nfs-csi-helm
        namespace: nfs-csi
      interval: 10m
  values:
    feature:
      enableFSGroupPolicy: true
  valuesFrom:
    - kind: ConfigMap
      name: csi-driver-nfs-cluster-values
      optional: true
