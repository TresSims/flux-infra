---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 10m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale-helm
        namespace: tailscale
      interval: 10m
  values:
    operatorConfig:
      hostname: k8s-deep-thonk
    apiServerProxyConfig:
      mode: "true"
