---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: kube-state-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics-helm
  interval: 10m
  values:
    prometheusScrape: false
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
